# 文件作用：把站点 /video/ 前缀反代到本机 MediaMTX HLS 服务。
#
# 必须在 location 里注入 Authorization: Bearer <CAMERA_HLS_CDN_SECRET>：
# MediaMTX 开启 hlsCDNSecret 后，只认这个 header 来建立稳定的 HLS 会话。
# 这样就不再依赖 Secure+Partitioned cookie（纯 HTTP 站点上会被浏览器丢弃），
# 播放列表里也不会再出现 ?session= 查询参数，播放列表与分片共用同一个固定会话，
# 避免 302 跳转后会话丢失、返回 HTML 错误页导致的“播放失败”。
#
# 部署时把下面 __CAMERA_HLS_CDN_SECRET__ 替换成 .env 中 CAMERA_HLS_CDN_SECRET 的
# 真实值（两边必须完全一致）。如需自动化，可在 deploy 前用 envsubst 渲染再 nginx -t。

location ^~ /video/ {
    # 结尾的斜杠会剥掉 /video/ 前缀，再把请求转发给 MediaMTX。
    proxy_pass http://127.0.0.1:8888/;
    proxy_redirect / /video/;

    # 给 MediaMTX 注入 CDN 会话密钥，所有 playlist/分片请求共用同一会话。
    proxy_set_header Authorization "Bearer __CAMERA_HLS_CDN_SECRET__";

    proxy_buffering off;
    proxy_read_timeout 120s;

    # HLS 播放列表/分片需要正确的 MIME 与保活的转发头。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
