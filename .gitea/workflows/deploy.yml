name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: watercleanbot-deploy
    steps:
      - name: Deploy on WaterCleanBot ECS
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /opt/watercleanbot
          git config --global --add safe.directory /opt/watercleanbot || true
          git fetch --prune gitea main
          # Execute the NEW deployment script before resetting the old checkout.
          # It preserves .env before Git stops tracking that file.
          update_script="$(mktemp)"
          trap 'rm -f -- "$update_script"' EXIT
          git show gitea/main:scripts/deploy-production.sh > "$update_script"
          bash "$update_script"
