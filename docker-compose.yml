# 文件作用：定义本地开发用 PostgreSQL/PostGIS 数据库容器。

# 本地开发栈。
# 此文件刻意保持小范围：只配置 PostgreSQL/PostGIS。
# 本地 MQTT Broker 请使用 docker-compose.mqtt.yml 和 start-mqtt.bat 单独启动。
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: watercleanbot-postgres
    environment:
      POSTGRES_DB: waterbot
      POSTGRES_USER: waterbot
      POSTGRES_PASSWORD: waterbot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/build_extensions.sql:/docker-entrypoint-initdb.d/001_build_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterbot -d waterbot"]
      interval: 10s
      timeout: 5s

      retries: 5

volumes:
  postgres_data:
    # 命名卷会在容器重启后保留本地数据库数据。
