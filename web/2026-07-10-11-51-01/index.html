<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aisland云管理平台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js';document.head.appendChild(s);"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Login Page -->
<div class="login-page" id="loginPage">
  <div class="login-bg"></div>
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>水面清洁机器人远程管理系统</h1>
      <p>AquaClean Robot Management Platform</p>
    </div>
    <div class="login-form">
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="loginUser" placeholder="请输入账号" value="admin">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="请输入密码" value="123456">
      </div>
      <div class="form-group">
        <div class="remember">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="checkbox" checked> 记住我
          </label>
          <a href="#">忘记密码?</a>
        </div>
      </div>
      <div class="form-group">
        <button class="btn-login" onclick="doLogin()">登 录</button>
      </div>
      <div class="login-tip">
        系统分配账号密码登录 · 首次登录请修改默认密码
      </div>
    </div>
  </div>
</div>

<!-- Main App -->
<div class="app" id="mainApp">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo-text">
        AquaClean
        <span>水面清洁管理平台</span>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">监控中心</div>
      <div class="nav-item active" onclick="navigate('dashboard')" data-page="dashboard">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></span>
        总览看板
      </div>
      <div class="nav-item" onclick="navigate('fleet')" data-page="fleet">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V7"/><path d="M3 7l9-4 9 4"/><circle cx="7" cy="14" r="1"/><circle cx="17" cy="14" r="1"/></svg></span>
        设备编队
        <span class="nav-badge">12</span>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">设备管理</div>
      <div class="nav-item" onclick="navigate('devices')" data-page="devices">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg></span>
        设备列表
      </div>
      <div class="nav-item" onclick="navigate('device-detail')" data-page="device-detail">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.62.22 1.07.82 1 1.51V11a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span>
        设备详情
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">业务管理</div>
      <div class="nav-item" onclick="navigate('water-areas')" data-page="water-areas">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20"/><path d="M2 12c2-3 4-5 6-5s4 2 6 5 4 5 6 5"/><path d="M2 12c2 3 4 5 6 5s4-2 6-5 4-5 6-5"/></svg></span>
        水域管理
      </div>
      <div class="nav-item" onclick="navigate('tasks')" data-page="tasks">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></span>
        任务管理
      </div>
      <div class="nav-item" onclick="navigate('scheduling')" data-page="scheduling">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        任务调度
      </div>
      <div class="nav-item" onclick="navigate('alerts')" data-page="alerts">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></span>
        预警管理
        <span class="nav-badge">3</span>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">系统管理</div>
      <div class="nav-item" onclick="navigate('accounts')" data-page="accounts">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        账号管理
      </div>
      <div class="nav-item" onclick="navigate('roles')" data-page="roles">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        角色管理
      </div>
      <div class="nav-item" onclick="navigate('permissions')" data-page="permissions">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
        权限管理
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">个人</div>
      <div class="nav-item" onclick="navigate('profile')" data-page="profile">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.66V16a2 2 0 012-2h6a2 2 0 012 2v4.66"/></svg></span>
        个人中心
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="topbar">
      <div class="breadcrumb">首页 / <span id="currentPageName">总览看板</span></div>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="搜索设备、水域、任务..." id="globalSearch" autocomplete="off">
        <div class="search-suggestions" id="searchSuggestions"></div>
      </div>
      <div class="topbar-right">
        <div class="icon-btn" onclick="showNotifications()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="dot"></span>
        </div>
        <div class="icon-btn" onclick="navigate('profile')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9"/></svg>
        </div>
        <div class="user-info" onclick="navigate('profile')">
          <div class="avatar">管</div>
          <span class="user-name">管理员</span>
        </div>
      </div>
    </div>

    <div class="content" id="contentArea">
      <!-- Views will be rendered here -->
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent">
  </div>
</div>

<!-- 模块化脚本：数据 → 地图 → 视图 → MQTT → 核心逻辑（顺序不可变）-->
<script src="assets/js/data.js"></script>
<script src="assets/js/map.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/mqtt.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
